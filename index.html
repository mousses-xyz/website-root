<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mousses.xyz</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --card: #161b22;
      --border: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 36rem;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 4rem);
      letter-spacing: -0.03em;
    }

    p {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 1.125rem;
      line-height: 1.6;
    }

    .links {
      display: grid;
      gap: 0.75rem;
      margin-top: 2rem;
    }

    .links a {
      display: block;
      padding: 1rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      background: var(--card);
      color: var(--fg);
      text-decoration: none;
      transition: border-color 150ms ease, transform 150ms ease;
    }

    .links a:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .links small {
      display: block;
      margin-top: 0.25rem;
      color: var(--muted);
    }

    a {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>mousses.xyz</h1>
    <p>Home for the Mousses family projects.</p>

    <div class="links">
      <a href="https://github.com/mousses-xyz">
        GitHub
        <small>github.com/mousses-xyz</small>
      </a>
      <a href="https://peter.mousses.xyz">
        Peter's site
        <small>peter.mousses.xyz</small>
      </a>
    </div>
  </main>
</body>
</html>
